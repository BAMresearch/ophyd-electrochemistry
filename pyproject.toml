[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ophyd-electrochemistry"
dynamic = ["version"]
description = "Contract template for Bluesky electrochemistry and a Keithley 2460 backend"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = ["bluesky>=1.16,<1.17", "ophyd>=1.11.2,<2", "event-model>=1.23,<2"]
classifiers = ["Development Status :: 1 - Planning", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
visa = ["pyvisa>=1.14,<2", "pyvisa-py>=0.7,<1"]
experiment = ["pandas>=2.2,<3", "openpyxl>=3.1,<4", "h5py>=3.11,<4", "plotly>=6,<7", "nbformat>=5.10,<6"]
queueserver = ["bluesky-queueserver>=0.0.25,<0.1", "bluesky-queueserver-api>=0.0.13,<0.1"]

[project.urls]
repository = "https://github.com/BAMresearch/ophyd-electrochemistry"
issues = "https://github.com/BAMresearch/ophyd-electrochemistry/issues"

[project.scripts]
oe-diagnose = "ophyd_electrochemistry.keithley.k2460.commissioning:main"
oe-new-run = "ophyd_electrochemistry.sequences.notebook:main"
oe-enqueue = "ophyd_electrochemistry.sequences.queueserver:enqueue_main"
oe-validate = "ophyd_electrochemistry.sequences.queueserver:validate_main"

[dependency-groups]
test = ["pytest>=8,<10", "lupa>=2.8,<3"]
lint = ["ruff>=0.11,<1", "mypy>=1.15,<3"]
docs = ["mkdocs>=1.6,<2"]
notebook = ["ipykernel>=6,<8", "nbformat>=5.10,<6", "plotly>=6,<7"]
build = ["twine>=6,<7"]
release = ["python-semantic-release==10.7.0"]
dev = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "h5py>=3.11,<4",
    "bluesky-queueserver>=0.0.25,<0.1",
    "bluesky-queueserver-api>=0.0.13,<0.1",
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
    {include-group = "notebook"},
    {include-group = "build"},
]

[tool.uv]
required-version = ">=0.12.19"
build-constraint-dependencies = ["setuptools==84.0.0", "wheel==0.48.0"]

[tool.setuptools.dynamic]
version = {attr = "ophyd_electrochemistry.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ophyd_electrochemistry = ["py.typed", "keithley/k2460/tsp/*.tsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not hardware'"
markers = [
    "hardware: explicit bench tests requiring a commissioned 2460 and a dummy load",
    "queueserver: starts redis-server and an RE Manager (skipped without redis-server)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["briefs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["examples", "ophyd_electrochemistry"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["bluesky.*", "ophyd.*"]
follow_untyped_imports = true

# Same single-source version and commit types as McSAS3/MoDaCor.
# Release metadata goes through a PR; no direct version commits to main.
[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"
version_variables = ["src/ophyd_electrochemistry/__init__.py:__version__"]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "enh", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat", "enh"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = ["^chore", ".*\\bGHA\\b.*", ".*\\b[gG][hH] actions?\\b.*"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
mask_initial_release = false

[tool.semantic_release.publish]
upload_to_vcs_release = false
