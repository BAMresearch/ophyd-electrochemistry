# B2 resistor session (tier 1): 100 ohm on the front terminals, 4-wire.
# OE_SESSION=bench/b2/session-resistor.toml
backend = "k2460"
data_dir = "~/k2460-data/b2/resistor"
resource = "TCPIP0::169.254.113.151::5025::SOCKET"
serial = "04686198"
terminals = "front"
poll_period_s = 1.0
start_timeout_s = 300.0  # b2r-pulse-ext: abort if no START within 5 min

[limits]
v_min_abs = -0.8
v_max_abs = 0.8
i_max_abs = 0.005
max_duration_s = 7200.0
max_records = 1000000
