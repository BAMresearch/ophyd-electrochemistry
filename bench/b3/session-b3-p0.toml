# B3 P0: overnight C/5 sodiation, desodiation, sodiation of a healthy HC/Na
# coin cell (tier 2). Cell: AlCe Test Cell 1 (1.78 mg hard carbon, 400 mAh/g,
# 0.712 mAh; C/5 = 142 uA). Front terminals, four-wire, HC on HI (force +
# sense), Na on LO. Window 0-3 V: a reversed cell (negative OCV) stops at the
# first reading. 200 uA covers C/5 of a cell up to 1 mAh and caps the CV hold
# at 5 mV. 40 h covers the row's bound (two cycles of 8 h CC steps, 1 h CV,
# 30 min rests). Loading this session confirms set-up and limits.
# qserver/start-k2460-re-manager.sh bench/b3/session-b3-p0.toml
backend = "k2460"
data_dir = "~/k2460-data/b3"
resource = "TCPIP0::169.254.113.151::5025::SOCKET"
serial = "04686198"
terminals = "front"
poll_period_s = 1.0

[limits]
v_min_abs = 0.0
v_max_abs = 3.0
i_max_abs = 0.0002
max_duration_s = 144000.0
max_records = 1000000
